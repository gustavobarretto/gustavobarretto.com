title: Internal Developer Platform
organization: "@mercadolibre"
organizationUrl: https://x.com/mercadolibre
period: "Since 2022"
kind: experience
date: 2026-01-01
description: >-
  I’ve been developing Mercado Libre’s internal developer platform (IDP) since
  2022, building infrastructure services for engineers who develop and run
  applications on Fury.
details:
  - >-
    From 2022 to 2025, I helped build and operate a service that delivered
    business and infrastructure configuration to Fury applications across
    roughly 200,000 machines. It helped teams apply Factor III of the
    Twelve-Factor App by managing deployment configuration separately from
    application code.
highlights:
  - title: "Backup and recovery"
    description: >-
      Set up automated backups across cloud providers and accounts to
      protect data against ransomware and support recovery during outages.
  - title: "Multicloud data plane"
    description: >-
      Built a data plane with service affinity and cross-cloud fallbacks
      to deliver bootstrap configuration to around 200,000 machines
      across AWS and Google Cloud.
  - title: "Site isolation"
    description: >-
      Segmented the application end to end for specific sites, with
      separate data and infrastructure for each.
  - title: "Configuration rollout"
    description: >-
      Designed a distributed queue to deliver relatively static data as
      files, propagating updates to nearly 200,000 machines within
      about 30 seconds.
  - title: "Control plane metadata"
    description: >-
      Helped make the service the default way to pass metadata between the
      control plane and the data plane.
  - title: AI tools for developers
    description: >-
      Built Model Context Protocol (MCP) servers and automated harnesses so
      engineers could use internal platform services from their AI tools.
linkSecondary: https://12factor.net/config
linkSecondaryLabel: "The Twelve-Factor App · III. Config"
translations:
  pt-BR:
    title: Plataforma interna de desenvolvimento
    period: "Desde 2022"
    description: >-
      Desde 2022, desenvolvo a plataforma interna de desenvolvimento (IDP)
      do Mercado Livre, criando serviços de infraestrutura para as equipes que
      desenvolvem e operam aplicações na Fury.
    details:
      - >-
        De 2022 a 2025, ajudei a desenvolver e operar um serviço que
        distribuiu configurações de negócio e infraestrutura para aplicações
        da Fury em cerca de 200 mil máquinas. O serviço ajudou as equipes a
        aplicar o Fator III do Twelve-Factor App, separando a configuração
        de implantação do código da aplicação.
    highlights:
      - title: Backup e recuperação
        description: >-
          Configurei backups automatizados em diferentes provedores e contas
          de nuvem para proteger os dados contra ransomware e apoiar a
          recuperação durante interrupções.
      - title: Plano de dados multicloud
        description: >-
          Criei um plano de dados com afinidade entre serviços e mecanismos
          de contingência entre nuvens para entregar configurações de
          inicialização a cerca de 200 mil máquinas na AWS e no Google Cloud.
      - title: Isolamento por site
        description: >-
          Segmentei a aplicação de ponta a ponta para sites específicos,
          com dados e infraestrutura separados para cada um.
      - title: Distribuição de configurações
        description: >-
          Projetei uma fila distribuída para entregar dados relativamente
          estáticos em arquivos, propagando atualizações para quase
          200 mil máquinas em cerca de 30 segundos.
      - title: Metadados do plano de controle
        description: >-
          Ajudei a tornar o serviço o caminho padrão para a troca de
          metadados entre os planos de controle e de dados.
      - title: Ferramentas de IA para desenvolvedores
        description: >-
          Criei servidores Model Context Protocol (MCP) e harnesses de
          automação para que as equipes de engenharia pudessem usar serviços
          da plataforma interna a partir das suas ferramentas de IA.
    linkSecondaryLabel: "The Twelve-Factor App · III. Configuração"
  es:
    title: Plataforma interna de desarrollo
    period: "Desde 2022"
    description: >-
      Desde 2022, desarrollo la plataforma interna de desarrollo (IDP) de
      Mercado Libre y creo servicios de infraestructura para los equipos que
      desarrollan y operan aplicaciones en Fury.
    details:
      - >-
        Entre 2022 y 2025, ayudé a desarrollar y operar un servicio que
        distribuía configuraciones de negocio e infraestructura a las
        aplicaciones de Fury en unas 200.000 máquinas. El servicio ayudó a
        los equipos a aplicar el Factor III de The Twelve-Factor App al
        separar la configuración de despliegue del código de la aplicación.
    highlights:
      - title: Copias de seguridad y recuperación
        description: >-
          Configuré copias de seguridad automatizadas en varios proveedores
          y cuentas de nube para proteger los datos frente al ransomware
          y facilitar la recuperación ante interrupciones.
      - title: Plano de datos multinube
        description: >-
          Creé un plano de datos con afinidad entre servicios y mecanismos de
          contingencia entre nubes para entregar la configuración de arranque
          a unas 200.000 máquinas en AWS y Google Cloud.
      - title: Aislamiento por sitio
        description: >-
          Segmenté la aplicación de extremo a extremo para sitios específicos,
          con datos e infraestructura separados para cada uno.
      - title: Distribución de configuraciones
        description: >-
          Diseñé una cola distribuida para entregar datos relativamente
          estáticos en archivos y propagar las actualizaciones a casi 200.000
          máquinas en unos 30 segundos.
      - title: Metadatos del plano de control
        description: >-
          Ayudé a convertir el servicio en la vía predeterminada para
          intercambiar metadatos entre los planos de control y de datos.
      - title: Herramientas de IA para desarrolladores
        description: >-
          Creé servidores Model Context Protocol (MCP) y sistemas de
          automatización para que los equipos de ingeniería pudieran usar
          servicios de la plataforma interna desde sus herramientas de IA.
    linkSecondaryLabel: "The Twelve-Factor App · III. Configuración"
