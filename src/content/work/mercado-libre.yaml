title: Internal Developer Platform
organization: "@mercadolibre"
organizationUrl: https://x.com/mercadolibre
period: "Since 2022"
kind: experience
date: 2026-01-01
description: >-
  I build infrastructure and configuration services for Fury, Mercado Libre’s
  internal developer platform (IDP).
highlights:
  - title: Multicloud configuration and protection
    description: >-
      Automated backups across cloud accounts and built a data plane with
      cross-cloud failover to deliver startup configuration to about 200,000
      machines on AWS and Google Cloud.
  - title: Infrastructure, traffic, and data isolation
    description: >-
      Isolated infrastructure, traffic, and data by site and distributed
      control plane metadata to each site’s data plane.
  - title: Developer experience (UI/UX)
    description: >-
      Built tooling to roll out configuration updates in about 30 seconds
      and let developers access IDP services from AI tools via MCP.
translations:
